app:
  description: 多智能体默认兜底工作流：处理超出眼底健康范围的问题，并提示门户与拍片室演示入口。
  icon: W9
  icon_background: '#EFF6FF'
  mode: workflow
  name: W90_通用兜底引导
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - remote_url
        - local_file
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
    - id: start__source__to__llm_fallback
      source: start
      sourceHandle: source
      target: llm_fallback
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        isInIteration: false
        sourceType: start
        targetType: llm
    - id: llm_fallback__source__to__end
      source: llm_fallback
      sourceHandle: source
      target: end
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        isInIteration: false
        sourceType: llm
        targetType: end
    nodes:
    - id: start
      type: custom
      width: 244
      height: 98
      selected: false
      position:
        x: 80
        y: 240
      positionAbsolute:
        x: 80
        y: 240
      data:
        type: start
        title: 开始
        desc: ''
        selected: false
        variables:
        - variable: query
          label: 用户输入
          type: paragraph
          required: true
          max_length: 4000
          options: []
    - id: llm_fallback
      type: custom
      width: 244
      height: 98
      selected: false
      position:
        x: 380
        y: 240
      positionAbsolute:
        x: 380
        y: 240
      data:
        type: llm
        title: 礼貌边界与引导说明
        desc: ''
        selected: false
        model:
          provider: deepseek
          name: deepseek-chat
          mode: chat
          completion_params:
            temperature: 0.25
        prompt_template:
        - id: llm_fallback_sys
          role: system
          text: '你是「视健康」眼科智能体系统的默认兜底助手。严禁使用任何 Emoji。

            当用户输入与眼科检查/日常护眼/患者会诊无关时，礼貌说明自己的服务范围（医院眼底报告解读、症状分诊、眼科科普与医生辅助会诊），若提及突发黑影、闪光感、遮挡或剧痛等症状仍立即提醒去眼科急诊；并可告知医患门户体验地址：https://severj.top/v1/demo
            ，拍片室同步模拟地址：https://severj.top/v1/imaging_room 。'
        - id: llm_fallback_usr
          role: user
          text: 用户输入：{{#start.query#}}
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
        memory:
          role_prefix:
            user: ''
            assistant: ''
        selected_variables: []
    - id: end
      type: custom
      width: 244
      height: 98
      selected: false
      position:
        x: 680
        y: 240
      positionAbsolute:
        x: 680
        y: 240
      data:
        type: end
        title: 结束
        desc: ''
        selected: false
        outputs:
        - variable: answer
          value_selector:
          - llm_fallback
          - text
    viewport:
      x: 0
      y: 0
      zoom: 1
