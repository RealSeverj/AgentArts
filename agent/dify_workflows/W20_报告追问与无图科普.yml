app:
  description: 支持有图场景读取冻结 EvidencePacket 进行精确追问，也支持无图场景下纸质体检名词（TSLN/DN/ODC/LS）去焦虑科普与检查引导。
  icon: W2
  icon_background: '#EFF6FF'
  mode: workflow
  name: W20_报告追问与无图科普
  use_icon_as_answer_icon: false
kind: app
version: 0.1.5
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - remote_url
        - local_file
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    nodes:
    - id: start
      type: custom
      position:
        x: 80
        y: 260
      data:
        type: start
        title: 开始
        desc: ''
        variables:
        - variable: user_query
          label: 用户提问内容
          type: paragraph
          required: true
          max_length: 2000
          options: []
        - variable: assessment_id
          label: 当前检查 assessment_id（无图留空）
          type: text-input
          required: false
          max_length: 128
          options: []
        - variable: audience
          label: 受众视角（patient / caregiver / clinician）
          type: text-input
          required: false
          max_length: 32
          options: []
    - id: if_has_id
      type: custom
      position:
        x: 360
        y: 260
      data:
        type: if-else
        title: 判断是否存在已建档检查ID
        desc: ''
        cases:
        - case_id: 'true'
          id: 'true'
          logical_operator: and
          conditions:
          - id: cond_asmt_not_empty
            variable_selector:
            - start
            - assessment_id
            comparison_operator: not empty
            value: ''
    - id: http_assessment
      type: custom
      position:
        x: 660
        y: 140
      data:
        type: http-request
        title: 读取冻结检查证据
        desc: ''
        method: get
        url: https://severj.top/v1/assessments/{{#start.assessment_id#}}
        authorization:
          type: no-auth
          config: null
        headers: 'X-API-Key: YOUR_RETINA_API_KEY'
        params: ''
        body:
          type: none
          data: []
        timeout:
          max_connect_timeout: 10
          max_read_timeout: 15
          max_write_timeout: 30
        ssl_verify: true
    - id: kb_with_img
      type: custom
      position:
        x: 960
        y: 140
      data:
        type: knowledge-retrieval
        title: 检索证据依据与标签字典
        desc: ''
        query_variable_selector:
        - start
        - user_query
        dataset_ids:
        - REPLACE_WITH_AGENTARTS_KB_ID
        retrieval_mode: multiple
        multiple_retrieval_config:
          top_k: 5
          score_threshold: 0.35
          reranking_enable: false
    - id: llm_answer_img
      type: custom
      position:
        x: 1260
        y: 140
      data:
        type: llm
        title: A2 证据溯源问答
        desc: ''
        model:
          provider: deepseek
          name: deepseek-chat
          mode: chat
          completion_params:
            temperature: 0.2
        prompt_template:
        - id: llm_answer_img_sys
          role: system
          text: '你是眼底医学解读问答智能体（A2）。绝对禁止使用任何 Emoji。

            先直接回答用户问题，再说明本次检查证据（EvidencePacket），最后给出下一步建议：

            1. 严格以冻结 EvidencePacket 中的眼别、质控、糖网分级与 13 项标签得分为准，绝不窜用其他眼别或改写数值；

            2. 不把 0~100 标度的得分解释为患病概率百分比；

            3. 关键解释须关联真实来源编号（如 [SRC_DICT_DN_AMD]、[SRC_DICT_LS]、[SRC_DR_GUIDELINE_2024]）；

            4. 按 audience（patient/caregiver/clinician）调整话术详略，并在结尾保留报告下载入口（若 evidence
            中有 report_url）。'
        - id: llm_answer_img_usr
          role: user
          text: '受众模式：{{#start.audience#}}

            用户问题：{{#start.user_query#}}

            冻结证据接口返回：{{#http_assessment.body#}}

            知识库检索片段：{{#kb_with_img.result#}}'
        context:
          enabled: true
          variable_selector:
          - kb_with_img
          - result
        vision:
          enabled: false
        memory:
          role_prefix:
            user: ''
            assistant: ''
        selected_variables: []
    - id: kb_no_img
      type: custom
      position:
        x: 660
        y: 390
      data:
        type: knowledge-retrieval
        title: 检索大众体检与慢病科普
        desc: ''
        query_variable_selector:
        - start
        - user_query
        dataset_ids:
        - REPLACE_WITH_AGENTARTS_KB_ID
        retrieval_mode: multiple
        multiple_retrieval_config:
          top_k: 5
          score_threshold: 0.35
          reranking_enable: false
    - id: llm_answer_no_img
      type: custom
      position:
        x: 960
        y: 390
      data:
        type: llm
        title: A4 无图体检名词科普与分诊
        desc: ''
        model:
          provider: deepseek
          name: deepseek-chat
          mode: chat
          completion_params:
            temperature: 0.2
        prompt_template:
        - id: llm_answer_no_img_sys
          role: system
          text: '你是眼底医学科普与无图导诊助手（A2+A4）。绝对禁止使用任何 Emoji。

            当前尚未上传或未绑定具体眼底照片，你必须严守无图咨询边界：

            1. 先排除急症：如用户提及突发大量飞蚊、闪光感、幕帘样遮挡、突发视力骤降或剧烈眼痛，立刻置顶提示当日前往眼科急诊 [SRC_NEI_RD_URGENT]；

            2. 对用户询问的体检报告词汇（如 TSLN 豹纹状眼底、DN 玻璃膜疣、OPTIC_DISC_CUPPING 视盘凹陷、LS 激光瘢痕）结合知识库做通俗去焦虑科普并标注
            [SRC_*]；

            3. 严禁在未见眼底图片的情况下对用户个人作出“眼底正常”或“排除病变”的判断，引导需要明确筛查时上传清晰眼底照并告知左右眼别 [SRC_EDU_NO_IMAGE_TRIAGE]。'
        - id: llm_answer_no_img_usr
          role: user
          text: '受众模式：{{#start.audience#}}

            用户问题：{{#start.user_query#}}

            知识库检索片段：{{#kb_no_img.result#}}'
        context:
          enabled: true
          variable_selector:
          - kb_no_img
          - result
        vision:
          enabled: false
        memory:
          role_prefix:
            user: ''
            assistant: ''
        selected_variables: []
    - id: end_with_evidence
      type: custom
      position:
        x: 1560
        y: 140
      data:
        type: end
        title: 结束（有图追问）
        desc: ''
        outputs:
        - variable: answer
          value_selector:
          - llm_answer_img
          - text
    - id: end_no_image
      type: custom
      position:
        x: 1260
        y: 390
      data:
        type: end
        title: 结束（无图科普）
        desc: ''
        outputs:
        - variable: answer
          value_selector:
          - llm_answer_no_img
          - text
    edges:
    - id: start__source__to__if_has_id
      source: start
      sourceHandle: source
      target: if_has_id
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: start
        targetType: if-else
    - id: if_has_id__true__to__http_assessment
      source: if_has_id
      sourceHandle: 'true'
      target: http_assessment
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: if-else
        targetType: http-request
    - id: http_assessment__source__to__kb_with_img
      source: http_assessment
      sourceHandle: source
      target: kb_with_img
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: http-request
        targetType: knowledge-retrieval
    - id: kb_with_img__source__to__llm_answer_img
      source: kb_with_img
      sourceHandle: source
      target: llm_answer_img
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: knowledge-retrieval
        targetType: llm
    - id: llm_answer_img__source__to__end_with_evidence
      source: llm_answer_img
      sourceHandle: source
      target: end_with_evidence
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: llm
        targetType: end
    - id: if_has_id__false__to__kb_no_img
      source: if_has_id
      sourceHandle: 'false'
      target: kb_no_img
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: if-else
        targetType: knowledge-retrieval
    - id: kb_no_img__source__to__llm_answer_no_img
      source: kb_no_img
      sourceHandle: source
      target: llm_answer_no_img
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: knowledge-retrieval
        targetType: llm
    - id: llm_answer_no_img__source__to__end_no_image
      source: llm_answer_no_img
      sourceHandle: source
      target: end_no_image
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        sourceType: llm
        targetType: end
