app:
  description: 医生端核心阅片工作流：自动抓取患者左/右眼最新院内影像执行六模型与四类病灶定位推理，结合医学指南库输出临床风险提示与医生版 PDF 报告。
  icon: D1
  icon_background: '#EFF6FF'
  mode: workflow
  name: D10_院内影像辅助诊断
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - remote_url
        - local_file
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
    - id: start__source__to__http_api
      source: start
      sourceHandle: source
      target: http_api
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        isInIteration: false
        sourceType: start
        targetType: http-request
    - id: http_api__source__to__kb_search
      source: http_api
      sourceHandle: source
      target: kb_search
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        isInIteration: false
        sourceType: http-request
        targetType: knowledge-retrieval
    - id: kb_search__source__to__llm_reply
      source: kb_search
      sourceHandle: source
      target: llm_reply
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        isInIteration: false
        sourceType: knowledge-retrieval
        targetType: llm
    - id: llm_reply__source__to__end
      source: llm_reply
      sourceHandle: source
      target: end
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        isInIteration: false
        sourceType: llm
        targetType: end
    nodes:
    - id: start
      type: custom
      width: 244
      height: 98
      selected: false
      position:
        x: 80
        y: 240
      positionAbsolute:
        x: 80
        y: 240
      data:
        type: start
        title: 开始
        desc: ''
        selected: false
        variables:
        - variable: query
          label: 用户输入
          type: paragraph
          required: true
          max_length: 4000
          options: []
    - id: http_api
      type: custom
      width: 244
      height: 98
      selected: false
      position:
        x: 360
        y: 240
      positionAbsolute:
        x: 360
        y: 240
      data:
        type: http-request
        title: 执行六模型与病灶定位推理
        desc: ''
        selected: false
        method: post
        url: https://retina.example.com/v1/his/agent/doctor/diagnose
        authorization:
          type: no-auth
          config: null
        headers: 'Content-Type: application/json

          X-API-Key: YOUR_RETINA_API_KEY'
        params: ''
        body:
          type: json
          data:
          - id: http_api_json_body
            key: ''
            type: text
            value: '{"query": "{{#start.query#}}"}'
        timeout:
          max_connect_timeout: 10
          max_read_timeout: 120
          max_write_timeout: 30
        retry_config:
          max_retries: 1
          retry_enabled: false
          retry_interval: 100
        ssl_verify: true
    - id: kb_search
      type: custom
      width: 244
      height: 98
      selected: false
      position:
        x: 660
        y: 240
      positionAbsolute:
        x: 660
        y: 240
      data:
        type: knowledge-retrieval
        title: 检索医学与科普知识库
        desc: ''
        selected: false
        query_variable_selector:
        - start
        - query
        dataset_ids:
        - REPLACE_WITH_AGENTARTS_KB_ID
        retrieval_mode: multiple
        multiple_retrieval_config:
          top_k: 5
          score_threshold: 0.35
          reranking_enable: false
    - id: llm_reply
      type: custom
      width: 244
      height: 98
      selected: false
      position:
        x: 960
        y: 240
      positionAbsolute:
        x: 960
        y: 240
      data:
        type: llm
        title: 临床专业辅助诊断报告
        desc: ''
        selected: false
        model:
          provider: deepseek
          name: deepseek-chat
          mode: chat
          completion_params:
            temperature: 0.25
        prompt_template:
        - id: llm_reply_sys
          role: system
          text: '你是「视健康·眼科医生端临床辅助智能体」。严禁使用任何 Emoji。

            请严格忠于后端六模型推理与临床规则接口返回的结果及医学知识库指南：

            1. 简洁专业汇报：当前会诊患者、分析眼别、DR 分级（0~4级）、达到研究筛查线的异常标签、四类病灶定位关注区（MA/HE/EX/SE）及同眼纵向趋势；

            2. 明确给出专科进一步重点核查方向（如黄斑 OCT、眼压、视野、FFA 等）及知识库指南来源依据；

            3. 务必保留并输出接口返回的临床版报告链接（doctor_report_url），方便医生点击查看双图并导出标准 A4 PDF。'
        - id: llm_reply_usr
          role: user
          text: '医生指令：{{#start.query#}}

            辅助推理与规则返回：{{#http_api.body#}}

            医学指南参考片段：{{#kb_search.result#}}'
        context:
          enabled: true
          variable_selector:
          - kb_search
          - result
        vision:
          enabled: false
        memory:
          role_prefix:
            user: ''
            assistant: ''
        selected_variables: []
    - id: end
      type: custom
      width: 244
      height: 98
      selected: false
      position:
        x: 1260
        y: 240
      positionAbsolute:
        x: 1260
        y: 240
      data:
        type: end
        title: 结束
        desc: ''
        selected: false
        outputs:
        - variable: answer
          value_selector:
          - llm_reply
          - text
    viewport:
      x: 0
      y: 0
      zoom: 1
