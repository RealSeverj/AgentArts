app:
  description: 医生端报告调阅工作流：快速检索当前会诊患者或指定手机号名下的左/右眼归档临床 PDF 报告链接。
  icon: D2
  icon_background: '#EFF6FF'
  mode: workflow
  name: D20_患者报告调阅与对比
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - remote_url
        - local_file
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
    - id: start__source__to__http_api
      source: start
      sourceHandle: source
      target: http_api
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        isInIteration: false
        sourceType: start
        targetType: http-request
    - id: http_api__source__to__llm_reply
      source: http_api
      sourceHandle: source
      target: llm_reply
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        isInIteration: false
        sourceType: http-request
        targetType: llm
    - id: llm_reply__source__to__end
      source: llm_reply
      sourceHandle: source
      target: end
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        isInIteration: false
        sourceType: llm
        targetType: end
    nodes:
    - id: start
      type: custom
      width: 244
      height: 98
      selected: false
      position:
        x: 80
        y: 240
      positionAbsolute:
        x: 80
        y: 240
      data:
        type: start
        title: 开始
        desc: ''
        selected: false
        variables:
        - variable: query
          label: 用户输入
          type: paragraph
          required: true
          max_length: 4000
          options: []
    - id: http_api
      type: custom
      width: 244
      height: 98
      selected: false
      position:
        x: 360
        y: 240
      positionAbsolute:
        x: 360
        y: 240
      data:
        type: http-request
        title: 调取归档临床报告列表
        desc: ''
        selected: false
        method: post
        url: https://retina.example.com/v1/his/agent/doctor/records
        authorization:
          type: no-auth
          config: null
        headers: 'Content-Type: application/json

          X-API-Key: YOUR_RETINA_API_KEY'
        params: ''
        body:
          type: json
          data:
          - id: http_api_json_body
            key: ''
            type: text
            value: '{"query": "{{#start.query#}}"}'
        timeout:
          max_connect_timeout: 10
          max_read_timeout: 15
          max_write_timeout: 30
        retry_config:
          max_retries: 1
          retry_enabled: false
          retry_interval: 100
        ssl_verify: true
    - id: llm_reply
      type: custom
      width: 244
      height: 98
      selected: false
      position:
        x: 660
        y: 240
      positionAbsolute:
        x: 660
        y: 240
      data:
        type: llm
        title: 呈现临床报告索引
        desc: ''
        selected: false
        model:
          provider: deepseek
          name: deepseek-chat
          mode: chat
          completion_params:
            temperature: 0.25
        prompt_template:
        - id: llm_reply_sys
          role: system
          text: '你是「视健康·眼科医生端临床辅助智能体」。严禁使用任何 Emoji。

            根据后端返回的归档报告列表，简洁列出患者各次左/右眼检查的时间、DR 分级与可直接点击打开的临床报告链接（doctor_report_url），绝不篡改链接与分期数字。'
        - id: llm_reply_usr
          role: user
          text: '医生指令：{{#start.query#}}

            归档报告查询返回：{{#http_api.body#}}'
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
        memory:
          role_prefix:
            user: ''
            assistant: ''
        selected_variables: []
    - id: end
      type: custom
      width: 244
      height: 98
      selected: false
      position:
        x: 960
        y: 240
      positionAbsolute:
        x: 960
        y: 240
      data:
        type: end
        title: 结束
        desc: ''
        selected: false
        outputs:
        - variable: answer
          value_selector:
          - llm_reply
          - text
    viewport:
      x: 0
      y: 0
      zoom: 1
