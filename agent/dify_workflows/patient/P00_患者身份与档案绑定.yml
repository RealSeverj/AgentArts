app:
  description: 患者端起始工作流：通过手机号识别患者并同步医院拍片室档案状态，给予亲切欢迎与引导。
  icon: P0
  icon_background: '#EFF6FF'
  mode: workflow
  name: P00_患者身份与档案绑定
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - remote_url
        - local_file
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
    - id: start__source__to__http_api
      source: start
      sourceHandle: source
      target: http_api
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        isInIteration: false
        sourceType: start
        targetType: http-request
    - id: http_api__source__to__llm_reply
      source: http_api
      sourceHandle: source
      target: llm_reply
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        isInIteration: false
        sourceType: http-request
        targetType: llm
    - id: llm_reply__source__to__end
      source: llm_reply
      sourceHandle: source
      target: end
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        isInIteration: false
        sourceType: llm
        targetType: end
    nodes:
    - id: start
      type: custom
      width: 244
      height: 98
      selected: false
      position:
        x: 80
        y: 240
      positionAbsolute:
        x: 80
        y: 240
      data:
        type: start
        title: 开始
        desc: ''
        selected: false
        variables:
        - variable: query
          label: 用户输入
          type: paragraph
          required: true
          max_length: 4000
          options: []
    - id: http_api
      type: custom
      width: 244
      height: 98
      selected: false
      position:
        x: 360
        y: 240
      positionAbsolute:
        x: 360
        y: 240
      data:
        type: http-request
        title: 同步患者院内档案
        desc: ''
        selected: false
        method: post
        url: https://severj.top/v1/his/agent/patient/session
        authorization:
          type: no-auth
          config: null
        headers: 'Content-Type: application/json

          X-API-Key: YOUR_RETINA_API_KEY'
        params: ''
        body:
          type: json
          data:
          - id: http_api_json_body
            key: ''
            type: text
            value: '{"query": "{{#start.query#}}"}'
        timeout:
          max_connect_timeout: 10
          max_read_timeout: 15
          max_write_timeout: 30
        retry_config:
          max_retries: 1
          retry_enabled: false
          retry_interval: 100
        ssl_verify: true
    - id: llm_reply
      type: custom
      width: 244
      height: 98
      selected: false
      position:
        x: 660
        y: 240
      positionAbsolute:
        x: 660
        y: 240
      data:
        type: llm
        title: 患者端亲切接待
        desc: ''
        selected: false
        model:
          provider: deepseek
          name: deepseek-chat
          mode: chat
          completion_params:
            temperature: 0.25
        prompt_template:
        - id: llm_reply_sys
          role: system
          text: '你是「视健康·患者端个人眼健康管家」。严禁使用任何 Emoji。

            根据后端返回的档案接口结果，用温暖、亲切、像家人朋友一样自然的中文和患者打招呼：

            - 如果 bound=false，请温和礼貌地请患者告诉您他的手机号以便调出医院档案；

            - 如果 bound=true，亲切称呼患者姓名，简单告知已关联好他的既往病史和医院刚刚同步的新照片状态（若有），并热情询问今天想了解检查报告、平时护眼问题还是突然的眼部不适。'
        - id: llm_reply_usr
          role: user
          text: '患者本轮说：{{#start.query#}}

            院内档案接口返回：{{#http_api.body#}}'
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
        memory:
          role_prefix:
            user: ''
            assistant: ''
        selected_variables: []
    - id: end
      type: custom
      width: 244
      height: 98
      selected: false
      position:
        x: 960
        y: 240
      positionAbsolute:
        x: 960
        y: 240
      data:
        type: end
        title: 结束
        desc: ''
        selected: false
        outputs:
        - variable: answer
          value_selector:
          - llm_reply
          - text
    viewport:
      x: 0
      y: 0
      zoom: 1
